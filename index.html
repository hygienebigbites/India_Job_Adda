<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1e3a8a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IJA Hiring CRM</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--pri:#1e3a8a;--pri2:#2563eb;--ok:#16a34a;--bad:#dc2626;--warn:#f59e0b;--wa:#25d366;--org:#f97316}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}
label{font-size:12px;color:var(--mut);display:block;margin:10px 0 4px}
.hide{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
header b{flex:1;font-size:16px}
header .u{font-size:12px;opacity:.85}
header button{background:rgba(255,255,255,.15);color:#fff;padding:6px 10px;font-size:13px}
main{padding:12px 12px 90px;max-width:900px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:6}
nav button{flex:1;background:none;padding:8px 0 10px;font-size:11px;color:var(--mut);border-radius:0}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{color:var(--pri2);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#fff;border-radius:12px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--mut)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:4px}.bar>i{display:block;height:100%;background:var(--ok)}
.big{width:100%;padding:15px;font-size:17px;font-weight:700;color:#fff;background:var(--pri2);margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.chip{white-space:nowrap;padding:7px 12px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.lead{display:flex;gap:10px;align-items:center}
.lead .main{flex:1;min-width:0}
.lead .nm{font-weight:700}
.lead .sub{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbtn{width:44px;height:44px;border-radius:50%;font-size:20px;color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none}
.call{background:var(--ok)}.wa{background:var(--wa)}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;background:#eef2ff;color:var(--pri);margin:3px 4px 0 0}
.pill.Hot{background:#fee2e2;color:#b91c1c}.pill.Warm{background:#ffedd5;color:#c2410c}.pill.Cold{background:#e0f2fe;color:#0369a1}
.pill.due{background:#fef3c7;color:#92400e}.pill.new{background:#dcfce7;color:#166534}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px 30px}
.sheet h2{margin:0;font-size:20px}
.row{display:flex;gap:8px}.row>*{flex:1}
.act{padding:14px;font-size:16px;font-weight:700;color:#fff;text-align:center;text-decoration:none;border-radius:12px;display:block}
.seg{display:flex;gap:8px;margin:10px 0}
.seg button{flex:1;padding:14px;font-weight:700;font-size:15px;background:#fff;border:2px solid var(--line)}
.seg .c.on{border-color:var(--ok);background:#dcfce7}.seg .n.on{border-color:var(--bad);background:#fee2e2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.opt{padding:12px 8px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:600;text-align:center}
.opt.pos{border-color:#bbf7d0}.opt.neg{border-color:#fecaca}.opt.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.sec{font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.04em}
.save{width:100%;padding:15px;background:var(--pri);color:#fff;font-weight:700;font-size:16px;margin-top:10px}
.hist{font-size:12px;border-left:3px solid var(--line);padding:4px 0 4px 10px;margin:6px 0}
.hist b{font-size:13px}
.done{background:#dcfce7;border-radius:14px;padding:14px;text-align:center}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:50;font-size:14px;max-width:90%}
#toast.err{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.kpi{background:#fff;border-radius:12px;padding:10px}.kpi b{font-size:22px;display:block}.kpi span{font-size:11px;color:var(--mut)}
.hbar{display:flex;align-items:center;gap:8px;font-size:12px;margin:5px 0}
.hbar span:first-child{width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .b{flex:1;background:var(--line);border-radius:6px;height:14px;overflow:hidden}.hbar .b i{display:block;height:100%;background:var(--pri2)}
.hbar em{font-style:normal;width:40px;text-align:right;font-weight:700}
.login{max-width:360px;margin:12vh auto;padding:20px}
.logo{font-size:28px;font-weight:900;text-align:center;margin-bottom:4px}
.logo .a{color:var(--org)}.logo .b{color:var(--pri2)}.logo .c{color:var(--ok)}
.tpl{background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;border:1px solid var(--line)}
.tpl pre{white-space:pre-wrap;font:inherit;font-size:12px;color:var(--mut);margin:6px 0 0}
.spin{text-align:center;color:var(--mut);padding:30px}
.chk{width:20px;height:20px}
/* call panel – compact one-screen tagging */
.lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.lphone{font-size:15px;color:var(--mut);font-weight:600;letter-spacing:.3px}
.ltags{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:2px}.ltags .pill{margin:0}
.xbtn{padding:4px 10px;margin-left:4px}
.lfacts{font-size:12.5px;color:var(--mut);margin-top:6px;line-height:1.5}
.lnote{font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;line-height:1.6}
.actbar{margin-top:10px}
.act{padding:12px}
.rem{margin-top:10px;resize:vertical;min-height:42px;font-size:14px}
.sec .hint{font-weight:500;text-transform:none;letter-spacing:0;color:var(--mut);font-size:11px;margin-left:6px}
.sec.hl{color:var(--ok)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid.neg{margin-top:6px}
.opt{padding:11px 6px;font-size:12.5px;line-height:1.25}
.opt .need{font-size:11px}
.when{background:#eef2ff;border:1px solid #c7d2fe;border-radius:12px;padding:10px;margin:8px 0}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.histbox{margin-top:12px}.histbox summary{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;cursor:pointer;padding:6px 0}
/* ===================== LAYOUT v11: frozen bars, dense rows, desktop table ===================== */
header{height:52px;padding:0 14px}
.mut{color:var(--mut)}
/* frozen queue toolbar */
.qbar{position:sticky;top:52px;z-index:4;background:var(--bg);margin:-12px -12px 6px;padding:10px 12px 4px;border-bottom:1px solid var(--line)}
.kmini{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;align-items:center;margin-bottom:8px;scrollbar-width:none}.kmini .k{flex:0 0 auto}
.kmini .k{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.kmini .k b{color:var(--ink);font-size:14px}
.kmini .k.warn{background:#fef3c7;color:#92400e;border-color:#fde68a}
.kbar{display:inline-block;width:46px;height:5px;background:var(--line);border-radius:4px;overflow:hidden}.kbar i{display:block;height:100%;background:var(--ok)}
.qtools{display:flex;gap:8px;margin-bottom:8px}
.startbtn{flex:0 0 auto;background:var(--pri2);color:#fff;font-weight:700;padding:0 16px;font-size:15px;border-radius:10px;min-height:42px}
.startbtn span{background:rgba(255,255,255,.25);border-radius:999px;padding:1px 8px;margin-left:6px;font-size:12px}
.qsearch{flex:1;padding:9px 12px;min-height:42px}
.qbar .chips{margin-bottom:0}
.lhdr{display:none}
/* lead rows – phone: compact 4-line card */
#qlist .lead{display:grid;grid-template-columns:1fr auto;grid-template-areas:"name age" "job call" "tags call" "last act";gap:3px 10px;align-items:center;
  background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05);cursor:pointer;border:1.5px solid transparent}
#qlist .lead.sel{border-color:var(--pri2);background:#eff6ff}
.c-name{grid-area:name;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c-name b{font-size:15px}.c-name .ph{color:var(--mut);font-size:12.5px;margin-left:8px}
.c-job{grid-area:job;font-size:12.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c-job .mut{margin-left:6px;font-size:11.5px}
.c-age{grid-area:age;font-size:11.5px;color:var(--mut);text-align:right;white-space:nowrap}.c-age .mut{display:none}
.c-tags{grid-area:tags;min-width:0}.c-tags .pill{margin:0 4px 0 0}
.c-act{grid-area:act;font-size:12px;white-space:nowrap;color:var(--mut);display:flex;gap:8px;justify-content:flex-end}
.c-act b{color:var(--ink)}
.c-last{grid-area:last;font-size:12px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.c-last .nx{margin-left:8px;color:var(--pri2)}
.c-call{grid-area:call;justify-self:end}
.fab{position:fixed;right:16px;bottom:78px;z-index:7;background:var(--pri2);color:#fff;border-radius:999px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(37,99,235,.4)}
.fab span{background:rgba(255,255,255,.25);border-radius:999px;padding:1px 8px;margin-left:6px;font-size:12px}
/* call panel */
.ptop{position:sticky;top:-14px;z-index:3;background:var(--bg);margin:-14px -14px 0;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
.actv{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.actv span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;color:var(--mut)}.actv b{color:var(--ink)}
.tl{margin-top:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:2px 10px}
.tl>div{font-size:12.5px;padding:6px 0;border-bottom:1px dashed var(--line)}.tl>div:last-child{border-bottom:0}
.tl .mut{font-size:12px}
@media(max-width:899px){
  .startbtn{display:none}
  #qlist .lead.fresh .c-last,#qlist .lead.fresh .c-act{display:none}
  .c-job .mut{display:none}
  #qlist .lead{padding:9px 12px}
  .overlay{align-items:stretch}
  .sheet{max-height:none;height:100%;border-radius:0;max-width:none}
}
@media(min-width:900px){
  .fab{display:none}
  nav{top:52px;bottom:0;right:auto;width:86px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding-top:6px}
  nav button{flex:0 0 auto;padding:12px 0}
  main{max-width:none;margin:0 0 0 86px;padding:12px 16px 24px}
  body.panel-open main{margin-right:470px}
  .qbar{margin:-12px -16px 0;padding:10px 16px 0}
  .lhdr{display:grid;font-size:11px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;padding:8px 12px 6px}
  .lhdr,#qlist .lead{grid-template-columns:minmax(150px,1.3fr) minmax(140px,1.2fr) 108px minmax(150px,1.2fr) 118px minmax(170px,1.5fr) 44px;gap:10px;align-items:center}
  #qlist .lead{grid-template-areas:none;border-radius:0;margin:0;box-shadow:none;border:0;border-bottom:1px solid var(--line);padding:7px 12px}
  #qlist .lead:hover{background:#f8fafc}
  #qlist .lead.sel{background:#eff6ff;box-shadow:inset 3px 0 0 var(--pri2)}
  #qlist{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  #qlist .lead>*{grid-area:auto}
  .c-name{display:flex;flex-direction:column}.c-name .ph{margin:0}
  .c-job{display:flex;flex-direction:column}.c-job .mut{margin:0}
  .c-age{text-align:left;color:var(--ink);font-size:12.5px}.c-age .mut{display:block}
  .c-last{white-space:normal;display:flex;flex-direction:column}.c-last .nx{margin:0}
  .c-act{justify-content:flex-start}
  .qbtn{width:38px;height:38px;font-size:17px}
  .overlay{justify-content:flex-end;align-items:stretch;background:transparent;pointer-events:none}
  .overlay .sheet{pointer-events:auto}
  .sheet{max-width:460px;max-height:calc(100vh - 52px);height:calc(100vh - 52px);margin-top:52px;border-radius:0;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
  #v-add .card,#v-search{max-width:760px}
}
@media(min-width:900px) and (max-width:1700px){
  body.panel-open .lhdr,body.panel-open #qlist .lead{grid-template-columns:minmax(140px,1.3fr) minmax(120px,1.1fr) minmax(130px,1.1fr) minmax(150px,1.4fr) 40px}
  body.panel-open .lhdr span:nth-child(3),body.panel-open .lhdr span:nth-child(5),body.panel-open .c-age,body.panel-open .c-act{display:none}
}
.modecard{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);padding:14px;margin-bottom:10px}
.modecard b{display:block;font-size:17px;margin-bottom:4px}.modecard span{font-size:13px;color:var(--mut)}
.modecard.on{border-color:var(--pri2);background:#eff6ff}
.sessbar{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--pri);background:#e0e7ff;border-radius:10px;padding:6px 8px;margin-bottom:10px;flex-wrap:wrap}
.sessbar .chip{padding:5px 9px;font-size:12px}
.cstat{margin-top:10px;padding:10px;border-radius:10px;background:#dcfce7;color:#166534;font-size:14px}
.cstat.ended{background:#fef3c7;color:#92400e;animation:pulse 1.2s 3}
@keyframes pulse{50%{transform:scale(1.02)}}
.cd{margin-top:10px;font-size:15px;color:var(--pri)}.cd b{font-size:22px}
#syncBadge{font-size:11px;background:#fef3c7;color:#92400e;padding:3px 8px;border-radius:10px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" class="login hide">
  <div class="logo"><span class="a">India</span><span class="b">Job</span><span class="c">Adda</span></div>
  <p style="text-align:center;color:var(--mut);margin-top:0">Hiring CRM</p>
  <div class="card">
    <label>Your name</label><select id="lgName"><option>Loading…</option></select>
    <label>PIN</label><input id="lgPin" type="password" inputmode="numeric" maxlength="8" placeholder="••••">
    <button class="save" onclick="doLogin()">Login</button>
  </div>
</div>

<!-- APP -->
<div id="appView" class="hide">
  <header><b>IJA Hiring CRM</b><span id="syncBadge" class="hide"></span><span class="u" id="hdrUser"></span><button onclick="refresh()">⟳</button><button onclick="logout()">⎋</button></header>
  <main>
    <section id="v-queue"></section>
    <section id="v-search" class="hide">
      <input id="sq" placeholder="🔎 Search name or phone (min 3 chars)" oninput="debounceSearch()">
      <div id="sres" style="margin-top:10px"></div>
    </section>
    <section id="v-add" class="hide"></section>
    <section id="v-dash" class="hide"></section>
    <section id="v-admin" class="hide"></section>
  </main>
  <nav id="nav"></nav>
</div>

<div id="ov" class="overlay hide" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="hide"></div>

<script>
/* ================= CONNECTION TO GOOGLE SHEET =================
   Your Apps Script "/exec" link. Only change this if you create a NEW deployment
   (updating with "Manage deployments → New version" keeps the same link). */
const API_URL='https://script.google.com/macros/s/AKfycbzxYs_xnRNdCgEv3TsKgIGl9IVBmyiWXT23KSVgsiqJW_koa7nUqtAnCLX03i0PeU8rsA/exec';
/* When opened from Netlify (outside Google), send requests with fetch – no Google cookies,
   so the multi-account "unable to open the file" error never appears. */
if(!(window.google&&google.script&&google.script.run)){
  const makeRun=()=>{let ok=()=>{},fail=()=>{};const p=new Proxy({},{get(t,k){
    if(k==='withSuccessHandler')return f=>{ok=f;return p};
    if(k==='withFailureHandler')return f=>{fail=f;return p};
    return (...args)=>{fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:k,args:args}),redirect:'follow',credentials:'omit'})
      .then(r=>r.json()).then(j=>j.ok?ok(j.data):fail(new Error(j.error||'Server error')))
      .catch(()=>fail(new Error('No connection – check internet and try again')))}}});return p};
  window.google={script:{get run(){return makeRun()}}};
}

/* ================= STATE ================= */
const S={auth:null,cfg:null,queue:[],stats:{},bucket:'All',cur:null,focus:false,callStart:0,dispo:{c:null,o:null},done:{},view:'queue',adminSel:new Set()};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function api(fn,...args){return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(e=>{const m=(e&&e.message)||String(e);toast(m,true);if(/log in|Login failed/.test(m))logout();rej(e)})[fn](...args)})}
let tT;function toast(m,err){const t=$('toast');t.textContent=m;t.className=err?'err':'';clearTimeout(tT);tT=setTimeout(()=>t.className='hide',err?4000:2200)}

const fmt=ms=>{if(!ms)return'';const d=new Date(ms);return d.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'numeric',minute:'2-digit',hour12:true})};
const fmtD=ms=>ms?new Date(ms).toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'}):'';
const ago=ms=>{if(!ms)return'';const m=Math.round((Date.now()-ms)/60000);if(m<0){const f=-m;return f<60?'in '+f+'m':f<1440?'in '+Math.round(f/60)+'h':'in '+Math.round(f/1440)+'d'}return m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago'};
const ymd=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const localInput=ms=>{const d=new Date(ms);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const wPhone=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===10)d='91'+d;return d};
const tPhone=p=>'+'+wPhone(p);

/* ================= LOGIN ================= */
window.onload=()=>{
  const a=store.get('ija_auth');
  if(a){S.auth=a;boot()}else showLogin();
};
function showLogin(){
  $('appView').classList.add('hide');$('loginView').classList.remove('hide');
  api('getUserNames').then(n=>{$('lgName').innerHTML=n.map(x=>`<option>${esc(x)}</option>`).join('')});
}
function doLogin(){S.auth={name:$('lgName').value,pin:$('lgPin').value.trim()};boot(true)}
function logout(){store.del('ija_auth');store.del('ija_q');S.auth=null;S.queue=[];S.qAt=0;showLogin()}
function boot(fresh){
  const cq=store.get('ija_q');
  if(cq&&S.auth&&cq.u===S.auth.name&&Date.now()-cq.at<6*3600e3){S.queue=cq.q.leads;S.stats=cq.q.stats} // show last list instantly
  api('login',S.auth).then(cfg=>{
    S.cfg=cfg;store.set('ija_auth',S.auth);

function pullMore(){api('pullLeads',S.auth).then(n=>{toast(n?n+' leads added to your queue':'Pool is empty for your city/language');loadQueue()})}
function findLead(id){return S.queue.find(l=>l.LeadID===id)||(S.searchRes||[]).find(l=>l.LeadID===id)}
/* ================= CALLING SESSION (Manual / Auto) =================
   Phone browsers can open the dialer with the number filled in, but cannot press the green
   button or detect hang-up. So:
   • AUTO  : after you tag a call, the NEXT number opens in the dialer by itself (countdown).
   • MANUAL: you tap "Call next" yourself.
   • Tag any time (during or after the call). Saving happens in the background, so it never blocks dialing.
   • Coming back to this screen from the dialer is treated as "call ended" → tagging panel is highlighted. */
const C={mode:store.get('ija_mode')||'',session:null,dialAt:0,hiddenAt:0,talk:0,left:false,cd:null,cdLeft:0,paused:false,tick:null};
function nextInQueue(){return S.queue.find(x=>x.bucket!=='Upcoming'&&!S.done[x.LeadID]&&(!S.cur||x.LeadID!==S.cur.LeadID))}
function startCalling(){
  if(!nextInQueue()&&!(S.cur&&!S.done[S.cur.LeadID])){autoRefill(true);return}
  const def=C.mode||'auto';
  $('ov').classList.remove('hide');
  $('sheet').innerHTML=`<h2 style="margin-bottom:4px">How do you want to call?</h2>
   <div class="sub" style="color:var(--mut);margin-bottom:12px">${S.queue.filter(x=>x.bucket!=='Upcoming'&&!S.done[x.LeadID]).length} leads ready</div>
   <button class="modecard ${def==='auto'?'on':''}" onclick="beginSession('auto')"><b>⚡ Auto dial</b><span>${isC2C()?`SlashRTC calls you and the candidate automatically. Not-connected calls are tagged by the system and the next call starts in ${S.cfg.settings.AutoDialDelaySec||3} sec.`:`After you tag a call, the next number opens in your dialer in ${S.cfg.settings.AutoDialDelaySec||3} sec. You just press the green call button.`}</span></button>
   <button class="modecard ${def==='manual'?'on':''}" onclick="beginSession('manual')"><b>🖐 Manual</b><span>You see the lead first and tap 📞 Call yourself. Good for follow-ups that need preparation.</span></button>
   <button class="chip" style="width:100%;padding:12px;margin-top:6px" onclick="closeSheet()">Cancel</button>`;
}
function beginSession(mode){
  C.mode=mode;store.set('ija_mode',mode);C.paused=false;
  C.session={start:Date.now(),calls:0,conn:0,talk:0};
  S.focus=true;
  const l=S.queue.find(x=>x.bucket!=='Upcoming'&&!S.done[x.LeadID]);
  if(!l){autoRefill(true);return}
  if(mode==='auto')dial(l);else openLead(l.LeadID);   // the tap on the mode card = user gesture, so the dialer is allowed to open
}
function endSession(){
  stopCountdown();const s=C.session;S.focus=false;
  if(s){toast(`Session done: ${s.calls} calls · ${s.conn} connected · ${Math.round(s.talk/60)} min`)}
  C.session=null;closeSheet();loadQueue();
}
function quickCall(id){const l=findLead(id);if(!l)return;S.cur=l;C.session=C.session||{start:Date.now(),calls:0,conn:0,talk:0};C.dialAt=Date.now();C.talk=0;C.left=false;openLead(id,true)}

/* Open dialer with the number (must run inside a tap). Then show the tagging screen. */
function dial(l){
  if(!l)return;
  if(isC2C())return c2cDial(l);
  stopCountdown();
  S.cur=l;S.dispo={c:null,o:null};
  C.dialAt=Date.now();C.talk=0;C.left=false;C.hiddenAt=0;
  const a=document.createElement('a');a.href='tel:'+tPhone(l.Phone);a.target='_top';document.body.appendChild(a);a.click();a.remove();
  openLead(l.LeadID,true);
  setTimeout(()=>{ if(!isC2C()&&!C.left&&S.cur===l&&C.dialAt){const b=$('dialHint');if(b)b.classList.remove('hide')} },1800); // dialer did not open → show tap-to-call
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){ if(C.dialAt){C.hiddenAt=Date.now();C.left=true} if(C.cd)pauseCountdown(true); }
  else { if(C.hiddenAt){C.talk+=Date.now()-C.hiddenAt;C.hiddenAt=0;
           const st=$('cstat');if(st&&S.dispo.o==null&&!isC2C()){st.innerHTML='📴 Call ended? <b>Tag the result below</b>';st.className='cstat ended'}
           const d=$('dispo');if(d)d.scrollIntoView({behavior:'smooth',block:'start'});}
         if(C.cd&&C.paused&&C.autoResume){C.autoResume=false;resumeCountdown()} }
});
setInterval(()=>{const t=$('ctimer');if(t&&C.dialAt){const s=Math.round((Date.now()-C.dialAt)/1000);t.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}},1000);

/* ================= SLASHRTC CLICK-TO-CALL =================
   SlashRTC rings the caller's phone first, then connects the candidate.
   The app watches the call status; not-connected calls are tagged automatically
   and (in Auto mode) the next call starts by itself – no taps needed. */
const isC2C=()=>S.cfg&&S.cfg.dialer==='slashrtc';
const T={poll:null,ref:null,startedAt:0,lastRes:null};
function c2cQuick(id){const l=findLead(id);if(!l)return;C.session=C.session||{start:Date.now(),calls:0,conn:0,talk:0};c2cDial(l)}
function c2cDial(l){
  if(!l)return;stopCountdown();stopPoll();
  S.cur=l;S.dispo={c:null,o:null};C.dialAt=Date.now();C.talk=0;C.left=false;C.hiddenAt=0;T.ref=null;T.lastRes=null;
  openLead(l.LeadID,true);
  setCstat('📲 Connecting via SlashRTC… <b>your phone will ring first – pick up</b>','');
  google.script.run.withSuccessHandler(r=>{ if(S.cur!==l)return; T.ref=r.ref;T.startedAt=Date.now();
      if(r.browserRequest){browserStart(l,r);return}
      if(S.cfg.telStatus==='none'){setCstat('📲 SlashRTC is calling <b>your phone</b> – pick up to connect. <span class="sub">When the call ends, tag the result below.</span> <b id="ctimer">00:00</b>','');return}
      startPoll(l) })
    .withFailureHandler(e=>{ if(S.cur!==l)return; C.dialAt=0;
      setCstat('❌ Call could not start: '+esc((e&&e.message)||'error')+`<br><a href="tel:${tPhone(l.Phone)}" style="color:inherit">Use phone dialer instead</a>`,'ended') })
    .startCall(S.auth,l.LeadID);
}
/* Browser mode: send the SlashRTC request from this device (SlashRTC only accepts approved networks) */
function sendReq(req){
  const opt={method:req.method,headers:req.headers||{},credentials:'omit',mode:'cors'};
  if(req.body!=null&&req.method!=='GET')opt.body=req.form?new URLSearchParams(req.body).toString():req.body;
  if(req.form)opt.headers=Object.assign({'Content-Type':'application/x-www-form-urlencoded'},opt.headers);
  return fetch(req.url,opt).then(res=>res.text().then(text=>{let json=null;try{json=JSON.parse(text)}catch(e){}return{code:res.status,text,json}}))
    .catch(()=>{throw new Error("This device couldn't reach SlashRTC. Either SlashRTC blocks browser requests from the CRM's web address, or this network isn't approved by SlashRTC.")});
}
const pathGet=(o,p)=>!p?undefined:String(p).split('.').reduce((x,k)=>x==null?undefined:x[k],o);
function browserStart(l,r){
  sendReq(r.browserRequest).then(res=>{
    const okHttp=res.code>=200&&res.code<300;
    const okBody=!r.successPath||String(pathGet(res.json,r.successPath)).toLowerCase()===String(r.successValue).toLowerCase();
    const callId=r.callIdPath?pathGet(res.json,r.callIdPath):'';
    google.script.run.withSuccessHandler(()=>{}).withFailureHandler(()=>{}).reportCallStart(S.auth,r.ref,{ok:okHttp&&okBody,text:res.text,callId:callId||'',error:okHttp&&okBody?'':'SlashRTC said: HTTP '+res.code+' '+res.text.slice(0,200)});
    if(S.cur!==l)return;
    if(okHttp&&okBody){
      if(S.cfg.telStatus==='none')setCstat('📲 SlashRTC is calling <b>your phone</b> – pick up to connect. <span class="sub">When the call ends, tag the result below.</span> <b id="ctimer">00:00</b>','');
      else startPoll(l);
    } else { C.dialAt=0;setCstat('❌ SlashRTC refused the call: '+esc(res.text.slice(0,160))+`<br><a href="tel:${tPhone(l.Phone)}" style="color:inherit">Use phone dialer instead</a>`,'ended') }
  }).catch(e=>{
    google.script.run.withSuccessHandler(()=>{}).withFailureHandler(()=>{}).reportCallStart(S.auth,r.ref,{ok:false,error:e.message});
    if(S.cur!==l)return;C.dialAt=0;
    setCstat('❌ '+esc(e.message)+`<br><a href="tel:${tPhone(l.Phone)}" style="color:inherit">Use phone dialer instead</a>`,'ended');
  });
}
function setCstat(html,cls){let st=$('cstat');if(!st){const d=$('dispo');if(!d)return;d.insertAdjacentHTML('beforebegin','<div id="cstat" class="cstat"></div>');st=$('cstat')}
  st.className='cstat '+(cls||'');st.innerHTML=html}
function startPoll(l){
  stopPoll();const ms=Math.max(3,+S.cfg.pollSec||4)*1000;
  T.poll=setInterval(()=>{
    if(!T.ref||S.cur!==l){stopPoll();return}
    if(Date.now()-T.startedAt>20*60000){stopPoll();return} // safety stop after 20 min
    google.script.run.withSuccessHandler(r=>onCallStatus(l,r)).withFailureHandler(()=>{}).getCallStatus(S.auth,T.ref);
  },ms);
}
function stopPoll(){if(T.poll)clearInterval(T.poll);T.poll=null}
const fmtDur=s=>s?(Math.floor(s/60)+'m '+(s%60)+'s'):'';
function onCallStatus(l,r){
  if(S.cur!==l)return;T.lastRes=r;
  const raw=r.status?` <span class="sub">(${esc(r.status)})</span>`:'';
  if(r.disposition&&r.auto){ // auto-tagged by SlashRTC status
    stopPoll();if(S.done[l.LeadID])return;
    const oc=S.cfg.outcomes.find(x=>x.o===r.disposition)||{o:r.disposition,c:false,g:'nc'};
    if(r.lead)Object.assign(l,r.lead);if(r.stats)S.stats=r.stats;
    S.done[l.LeadID]=1;const i=S.queue.findIndex(x=>x.LeadID===l.LeadID);if(i>=0)S.queue[i].bucket='Upcoming';
    if(C.session){C.session.calls++}
    C.dialAt=0;T.ref=null;
    afterSave(l,oc);
    setCstat('🤖 Auto-tagged from SlashRTC: <b>'+esc(oc.o)+'</b>'+raw,'');return;
  }
  if(r.disposition){stopPoll();return} // tagged already (by this caller)
  switch(r.result){
    case 'Failed': stopPoll();C.dialAt=0;setCstat('❌ Call failed'+raw+(r.error?'<br><span class="sub">'+esc(r.error)+'</span>':'')+' – tap Call to retry','ended');break;
    case 'Agent Missed': stopPoll();C.dialAt=0;setCstat('⚠️ You missed SlashRTC\'s call on your phone'+raw+' – tap <b>Call</b> to try again','ended');break;
    case 'Answered':
      if(r.duration>0){stopPoll();setCstat('✅ Call ended · talk time <b>'+fmtDur(r.duration)+'</b> – tag the outcome below'+raw,'ended');
        if(S.dispo.c===null){S.dispo={c:true,o:null};renderDispo()}}
      else setCstat('🟢 Connected – talking <b id="ctimer">00:00</b>'+raw,'');
      break;
    default: setCstat('📲 Ringing… <b id="ctimer">00:00</b>'+raw+' <span class="sub">– tag any time</span>','');
  }
}

   <div class="actv"><span>📞 <b>${hs.calls}</b> calls</span><span>✅ <b>${hs.conn}</b> connected</span><span>💬 <b>${hs.wa}</b> WhatsApp</span>${l.CreatedAt?`<span>🗓 Lead ${ago(+l.CreatedAt)}</span>`:''}</div>

/* ---------- ONE-SCREEN TAGGING ----------
   Not connected → 1 tap saves.  Connected (no date) → 1 tap saves.
   Connected needing a date → tap outcome, then tap a quick time (saves) or pick a custom one. */
function quickTimes(need){
  const at=(dAdd,h,m)=>{const t=new Date();t.setDate(t.getDate()+dAdd);t.setHours(h,m||0,0,0);return t.getTime()};
  const now=Date.now(),hr=new Date().getHours(),out=[];
  if(need==='visit'){ if(hr<14)out.push(['Today 4 PM',at(0,16)]); out.push(['Tomorrow 11 AM',at(1,11)],['Tomorrow 3 PM',at(1,15)],['Day after 11 AM',at(2,11)]); }
  if(need==='join'){ out.push(['Tomorrow',at(1,10)],['Day after',at(2,10)],['In 3 days',at(3,10)]);
    const mon=new Date();mon.setDate(mon.getDate()+((8-mon.getDay())%7||7));mon.setHours(10,0,0,0);out.push(['Next Monday',mon.getTime()]); }
  if(need==='next'){ out.push(['In 1 hr',now+3600e3],['In 3 hrs',now+3*3600e3]); if(hr<17)out.push(['Today 6 PM',at(0,18)]); out.push(['Tomorrow 11 AM',at(1,11)],['In 2 days',at(2,11)]); }
  return out;
}
function renderDispo(){

  const oc=d.o&&O.find(x=>x.o===d.o);
  let h=`<textarea id="dRem" rows="1" class="rem" placeholder="📝 Remark (optional) – type first, then tap result">${esc(d.rem||'')}</textarea>
   <div class="sec ncsec">❌ Not connected <span class="hint">1 tap${auto?' · next call starts':''}</span></div>
   <div class="grid3">${O.filter(o=>o.g==='nc').map(opt).join('')}</div>
   <div class="sec ${d.c===true?'hl':''}">✅ Connected <span class="hint">1 tap · 🗓 = pick a time</span></div>
   <div class="grid">${O.filter(o=>o.c&&o.g==='pos').map(opt).join('')}</div>

  $('dispo').innerHTML=h;
  if(oc&&oc.need&&oc.need!=='afterVisit'){ // inline time picker right under the chosen button
    const lbl=oc.need==='visit'?'Interview time':oc.need==='join'?'Joining date':'Call back';
    const def=oc.need==='visit'?quickTimes('visit')[0][1]:oc.need==='join'?quickTimes('join')[0][1]:Date.now()+(oc.h||24)*3600e3;
    const btn=[...$('dispo').querySelectorAll('.opt.on')][0];

      <div class="chips wrap">${quickTimes(oc.need).map(q=>`<button class="chip on" onclick="saveWhen(${q[1]})">${q[0]}</button>`).join('')}</div>
      <div class="row" style="align-items:center;margin-top:6px">${oc.need==='join'?`<input type="date" id="dJoin" value="${ymd(def)}">`:`<input type="datetime-local" id="${oc.need==='visit'?'dVisit':'dNext'}" value="${localInput(def)}">`}
      <button class="chip" style="flex:0 0 auto;padding:11px 14px;background:var(--pri);color:#fff;border:0" onclick="saveDispo()">Save</button></div>`;
    (btn&&btn.parentNode?btn.parentNode:$('dispo')).insertAdjacentElement('afterend',box);
  }
}
function pickOutcome(o){

  S.dispo.o=o;S.dispo.when=null;const oc=S.cfg.outcomes.find(x=>x.o===o);S.dispo.c=!!oc.c;

function saveDispo(){
  const l=S.cur,d=S.dispo,oc=S.cfg.outcomes.find(x=>x.o===d.o);if(!oc)return;
  const v=id=>$(id)&&$(id).value;
  const talk=C.talk+(C.hiddenAt?Date.now()-C.hiddenAt:0);
  if(isC2C()&&T.lastRes&&T.lastRes.disposition&&T.lastRes.auto)return toast('Already auto-tagged: '+T.lastRes.disposition);
  const p={leadId:l.LeadID,outcome:d.o,remarks:(v('dRem')||d.rem||'').trim(),at:Date.now(),ref:l.LeadID+'-'+Date.now(),callRef:(isC2C()&&T.ref)||'',
    secs:talk?Math.min(3600,Math.round(talk/1000)):(C.dialAt?Math.min(3600,Math.round((Date.now()-C.dialAt)/1000)):'')};
  if(v('dVisit'))p.visitAt=new Date(v('dVisit')).getTime();
  if(v('dJoin'))p.joinAt=new Date(v('dJoin')+'T10:00').getTime();
  if(v('dNext'))p.nextAt=new Date(v('dNext')).getTime();
  if(d.when){ if(oc.need==='visit')p.visitAt=d.when; else if(oc.need==='join')p.joinAt=d.when; else if(oc.need==='next')p.nextAt=d.when; }
  if(oc.need==='visit'&&!p.visitAt)return toast('Select interview date & time',true);
  if(oc.need==='join'&&!p.joinAt)return toast('Select joining date',true);
  // optimistic local update
  Object.assign(l,{LastOutcome:oc.o,Attempts:(+l.Attempts||0)+1,LastCallAt:p.at,VisitDate:p.visitAt||l.VisitDate,JoinDate:p.joinAt||l.JoinDate,NextActionAt:p.nextAt||l.NextActionAt});
  if(oc.stage)l.Stage=oc.stage;
  l.hs=l.hs||{calls:0,conn:0,wa:0,last:[]};l.hs.calls++;if(oc.c)l.hs.conn++;(l.hs.last=l.hs.last||[]).unshift({t:p.at,o:oc.o,by:S.cfg.user.Name,rem:p.remarks,secs:+p.secs||0});l.hs.last=l.hs.last.slice(0,3);
  S.done[l.LeadID]=1;
  const i=S.queue.findIndex(x=>x.LeadID===l.LeadID);if(i>=0)S.queue[i].bucket='Upcoming';
  if(C.session){C.session.calls++;if(oc.c)C.session.conn++;C.session.talk+=(+p.secs||0)}
  S.stats.calls=(S.stats.calls||0)+1;if(oc.c)S.stats.connected=(S.stats.connected||0)+1;
  if(isC2C()&&T.lastRes&&T.lastRes.duration)p.secs=T.lastRes.duration; // real talk time from SlashRTC
  Q.push(p);
  stopPoll();T.ref=null;T.lastRes=null;
  C.dialAt=0;C.talk=0;C.left=false;C.hiddenAt=0;
  afterSave(l,oc);
  if(C.session&&C.session.calls%5===0)refreshQueueSilently();
}
function afterSave(l,oc){
  const st=$('cstat');if(st){st.className='cstat';st.innerHTML='✅ Tagged · '+esc(oc.o)}

  if(!S.focus){

  const nextInfo=nx?`<div class="sub" style="margin-top:8px">Next: <b>${esc(nx.Name||nx.Phone)}</b> · ${esc([nx.JobRole,nx.City].filter(Boolean).join(' · '))}${nx.bucket==='Due'?' · ⏰ follow-up':nx.bucket==='New'?' · 🆕':''}</div>`:'<div class="sub" style="margin-top:8px">Queue finished – will fetch more leads</div>';
  $('dispo').innerHTML=`<div class="done"><div style="font-size:28px">✅</div><b>${esc(oc.o)}</b>${nextInfo}
    ${C.mode==='auto'&&nx?`<div class="cd" id="cdBox">Dialing next in <b id="cdN">${S.cfg.settings.AutoDialDelaySec||3}</b>s</div>`:''}
    <button class="save" style="background:var(--ok)" onclick="callNext()">📞 ${nx?'Call next now':'Get more leads'}</button>

  </div>`;
  if(C.mode==='auto'&&nx)startCountdown();

function startCountdown(){

/* ---------- Background save queue (offline-safe, no duplicates) ---------- */
const Q={items:store.get('ija_pending')||[],busy:false,
  push(p){this.items.push(p);this.save();this.flush()},
  save(){store.set('ija_pending',this.items);const b=$('syncBadge');if(b){b.textContent=this.items.length?'⏳ '+this.items.length+' saving':'';b.classList.toggle('hide',!this.items.length)}},
  flush(){
    if(this.busy||!this.items.length||!S.auth)return;this.busy=true;const p=this.items[0];
    google.script.run.withSuccessHandler(r=>{this.items.shift();this.busy=false;this.save();
        if(r&&r.lead){const q=S.queue.find(x=>x.LeadID===r.lead.LeadID);if(q){Object.assign(q,r.lead);q.bucket='Upcoming'}}
        if(r&&r.stats&&!this.items.length)S.stats=r.stats;
        if(r&&r.dispoRequest){const d=r.dispoRequest;sendReq(d.req).then(x=>{const ok=x.code>=200&&x.code<300&&!(x.json&&x.json.STATUS_CODE!==undefined&&+x.json.STATUS_CODE!==200);
            google.script.run.withSuccessHandler(()=>{}).withFailureHandler(()=>{}).reportDispo(S.auth,d.ref,ok?'OK':'HTTP '+x.code+' '+x.text.slice(0,150))})
          .catch(e=>google.script.run.withSuccessHandler(()=>{}).withFailureHandler(()=>{}).reportDispo(S.auth,d.ref,'ERR '+e.message))}
        this.flush()})
      .withFailureHandler(e=>{this.busy=false;const m=(e&&e.message)||'';p.tries=(p.tries||0)+1;
        if(/not found|Pick an outcome|Select/.test(m)||p.tries>5){this.items.shift();toast('Could not save '+p.outcome+': '+m,true)}
        this.save();setTimeout(()=>this.flush(),8000)})
      .saveDisposition(S.auth,p);
  }};
setInterval(()=>Q.flush(),15000);

  const d=(first.split('\t').length>first.split(',').length)?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'&&text[i+1]==='"'){f+='"';i++}else if(ch==='"')q=false;else f+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(f);f=''}else if(ch==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(ch!=='\r')f+=ch}
  row.push(f);rows.push(row);
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
function parseDateIN(v){
  v=String(v||'').trim();if(!v)return '';
  const m=v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[ T,]+(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(am|pm)?)?/i);
  if(m){let y=+m[3];if(y<100)y+=2000;let h=+(m[4]||0);if(m[7]){if(/pm/i.test(m[7])&&h<12)h+=12;if(/am/i.test(m[7])&&h===12)h=0}
    return new Date(y,+m[2]-1,+m[1],h,+(m[5]||0),+(m[6]||0)).getTime()}
  const t=new Date(v).getTime();return isNaN(t)?'':t;
}
function parseBulk(text){
  const rows=splitRows(text||'');
  if(rows.length<2){BU.rows=[];$('buPrev').innerHTML=rows.length?'<div class="sub" style="color:var(--bad)">Need a header row + at least 1 lead row</div>':'';return}
  const head=rows[0].map(h=>HEAD_ALIAS[String(h).trim().toLowerCase()]||(TPL_HEAD.includes(String(h).trim())?String(h).trim():''));
  if(!head.includes('Phone')){BU.rows=[];$('buPrev').innerHTML='<div class="sub" style="color:var(--bad)">❌ No Phone / Mobile column found in the header row</div>';return}
  const seen=new Set();let bad=0,dupIn=0;
  BU.rows=rows.slice(1).map(r=>{const o={};head.forEach((k,i)=>{if(k)o[k]=String(r[i]||'').trim()});if(o.LeadDate)o.LeadDate=parseDateIN(o.LeadDate);return o})
    .filter(o=>{const d=String(o.Phone||'').replace(/\D/g,'');if(d.length<10){bad++;return false}const k=d.slice(-10);if(seen.has(k)){dupIn++;return false}seen.add(k);return true});
  const ignored=rows[0].filter((h,i)=>!head[i]&&String(h).trim());
  $('buPrev').innerHTML=`<div class="done" style="text-align:left;margin-top:12px">
    <b>${BU.rows.length} leads ready</b> <span class="sub">· ${bad} invalid numbers · ${dupIn} repeated in file</span>
    ${ignored.length?`<div class="sub" style="color:var(--warn)">Columns ignored: ${esc(ignored.join(', '))}</div>`:''}
    <div style="overflow-x:auto;margin-top:8px"><table><tr><th>Name</th><th>Phone</th><th>City</th><th>Role</th><th>Lead date</th></tr>
    ${BU.rows.slice(0,8).map(o=>`<tr><td>${esc(o.Name||'')}</td><td>${esc(o.Phone)}</td><td>${esc(o.City||'')}</td><td>${esc(o.JobRole||'')}</td><td>${o.LeadDate?fmt(o.LeadDate):'today'}</td></tr>`).join('')}</table></div>
    ${BU.rows.length>8?`<div class="sub">…and ${BU.rows.length-8} more</div>`:''}
    <button class="save" onclick="doBulk(this)">⬆ Import ${BU.rows.length} leads</button></div>`;
}
function doBulk(btn){
  if(!BU.rows.length)return;btn.disabled=true;btn.textContent='Importing…';
  api('bulkAddLeads',S.auth,BU.rows,{Source:$('buSrc').value,AssignedTo:$('buTo').value}).then(r=>{
    $('buPrev').innerHTML=`<div class="done" style="margin-top:12px"><div style="font-size:28px">✅</div><b>${r.added} leads added</b>
      <div class="sub">${r.dups} already in CRM (skipped) · ${r.invalid} invalid numbers</div>
      ${r.dupList.length?`<div class="sub" style="margin-top:6px">Already existing: ${esc(r.dupList.slice(0,15).join(', '))}${r.dups>15?'…':''}</div>`:''}</div>`;
    BU.rows=[];$('buPaste').value='';$('buFile').value='';S.queue=[];
  }).catch(()=>{btn.disabled=false;btn.textContent='⬆ Import again'});
}

/* ================= DASHBOARD ================= */
function renderDashShell(){
  const c=S.cfg,isA=c.user.Role==='Admin',t=ymd(Date.now());
  $('v-dash').innerHTML=`<div class="card">
    <div class="chips">${[['Today',0,0],['Yesterday',1,1],['7 days',6,0],['30 days',29,0]].map(q=>`<button class="chip" onclick="setRange(${q[1]},${q[2]})">${q[0]}</button>`).join('')}</div>
    <div class="row"><div><label>From</label><input type="date" id="fFrom" value="${t}"></div><div><label>To</label><input type="date" id="fTo" value="${t}"></div></div>
    <div class="row">${isA?`<div><label>Caller</label><select id="fCaller"><option value="">All callers</option>${c.callers.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`:''}
      <div><label>Source</label><select id="fSrc"><option value="">All</option>${c.sources.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
      <div><label>City</label><select id="fCity"><option value="">All</option>${c.cities.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div>
    <button class="save" onclick="loadDash()">Apply filters</button>
    ${isA?`<button class="chip" style="width:100%;padding:10px;margin-top:8px" onclick="doExport()">⬇ Export matching leads to Sheet</button>`:''}
  </div><div id="dashBody"><div class="spin">Loading…</div></div>`;
  loadDash();
}
function setRange(back,end){const d=n=>ymd(Date.now()-n*864e5);$('fFrom').value=d(back);$('fTo').value=d(end);loadDash()}
function filters(){return{from:$('fFrom').value,to:$('fTo').value,caller:($('fCaller')||{}).value||'',source:$('fSrc').value,city:$('fCity').value}}
function doExport(){api('exportLeads',S.auth,filters()).then(r=>{toast(r.count+' leads exported');window.open(r.url,'_blank')})}
function hbars(obj,filterFn){const e=Object.entries(obj).filter(filterFn||(()=>true)).sort((a,b)=>b[1]-a[1]);const mx=Math.max(1,...e.map(x=>x[1]));
  return e.length?e.map(([k,v])=>`<div class="hbar"><span>${esc(k)}</span><div class="b"><i style="width:${v/mx*100}%"></i></div><em>${v}</em></div>`).join(''):'<div class="sub" style="color:var(--mut)">No data</div>'}
function loadDash(){
  $('dashBody').innerHTML='<div class="spin">Loading…</div>';
  api('getReport',S.auth,filters()).then(r=>{
    const k=r.kpi,pct=(a,b)=>b?Math.round(a/b*100)+'%':'–',FS=r.funnelStages,isA=S.cfg.user.Role==='Admin';
    const O=S.cfg.outcomes,ncSet=new Set(O.filter(o=>o.g==='nc').map(o=>o.o)),negSet=new Set(O.filter(o=>o.g==='neg').map(o=>o.o));
    const tbl=(obj,title)=>{const rows=Object.entries(obj);return `<div class="card"><div class="sec">${title}</div><div style="overflow-x:auto"><table><tr><th></th><th>Dials</th><th>Conn</th><th>%</th>${FS.map(f=>`<th>${esc(f)}</th>`).join('')}<th>WA</th></tr>
      ${rows.length?rows.sort((a,b)=>b[1].dials-a[1].dials).map(([n,x])=>`<tr><td>${esc(n)}</td><td>${x.dials}</td><td>${x.conn}</td><td>${pct(x.conn,x.dials)}</td>${FS.map(f=>`<td>${x.st[f]||0}</td>`).join('')}<td>${x.wa}</td></tr>`).join(''):`<tr><td colspan="${FS.length+5}">No activity</td></tr>`}</table></div></div>`};
    const days=Object.keys(r.daily).sort(),mx=Math.max(1,...days.map(d=>r.daily[d].dials));
    const wonSet=new Set(S.cfg.won);
    $('dashBody').innerHTML=`
     <div class="kpis">
       <div class="kpi"><b>${k.dials}</b><span>Total dials</span></div>
       <div class="kpi"><b>${k.uniqueDialed}</b><span>Unique leads dialed</span></div>
       <div class="kpi"><b>${k.connected}</b><span>Connected · ${pct(k.connected,k.dials)}</span></div>
       ${FS.map(f=>`<div class="kpi"><b ${wonSet.has(f)?'style="color:var(--ok)"':''}>${r.funnel[f]||0}</b><span>${esc(f)}</span></div>`).join('')}
       <div class="kpi"><b>${k.wa}</b><span>WhatsApps sent</span></div>
       <div class="kpi"><b>${r.newLeads}</b><span>New leads in period</span></div>
       <div class="kpi"><b style="color:var(--warn)">${r.dueNow}</b><span>Follow-ups due now</span></div>
       ${isA?`<div class="kpi"><b style="color:var(--bad)">${r.unassigned}</b><span>Unassigned leads</span></div>`:''}
       <div class="kpi"><b>${k.talkSecs?Math.round(k.talkSecs/60):0}</b><span>Approx. talk mins</span></div>
     </div>
     <div class="card"><div class="sec">Conversion funnel (period)</div>${hbars(r.funnel)}</div>
     <div class="card"><div class="sec">New lead quality (period)</div>${hbars(r.quality)}</div>
     <div class="card"><div class="sec">❌ Not connected – breakup</div>${hbars(r.outcomes,e=>ncSet.has(e[0]))}</div>
     <div class="card"><div class="sec">✅ Connected – outcome breakup</div>${hbars(r.outcomes,e=>!ncSet.has(e[0])&&!negSet.has(e[0]))}</div>
     <div class="card"><div class="sec">👎 Drop reasons</div>${hbars(r.outcomes,e=>negSet.has(e[0]))}</div>
     ${tbl(r.byCaller,'Caller performance')}
     ${tbl(r.bySource,'Source performance')}
     <div class="card"><div class="sec">Daily trend (dials · connected · ${esc(S.cfg.won[0]||'won')})</div>${days.length?days.map(d=>`<div class="hbar"><span>${d.slice(5)}</span><div class="b"><i style="width:${r.daily[d].dials/mx*100}%"></i></div><em style="width:70px">${r.daily[d].dials}·${r.daily[d].conn}·${r.daily[d].won}</em></div>`).join(''):'<div class="sub">No data</div>'}</div>
     <div class="card"><div class="sec">Live pipeline (current stage)</div>${hbars(r.pipeline,e=>e[1]>0)}</div>`;
  });
}

/* ================= ADMIN: ASSIGN ================= */
function loadAdmin(){
  const c=S.cfg;
  if(!$('adF')){$('v-admin').innerHTML=`
    <div id="adTop"><div class="spin">Loading…</div></div>
    <div class="card" id="adF"><div class="sec">Manual assignment</div>
      <div class="row"><div><label>Show</label><select id="aShow"><option value="UNASSIGNED">Unassigned (pool)</option><option value="ALL">All open</option>${c.callers.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
      <div><label>Stage</label><select id="aStage"><option value="">All open</option>${c.stages.map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div></div>
      <div class="row"><div><label>City</label><select id="aCityF"><option value="">All</option>${c.cities.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
      <div><label>Source</label><select id="aSrcF"><option value="">All</option>${c.sources.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>
      <div><label>Quality</label><select id="aQF"><option value="">All</option>${(c.lists.Quality||['Hot','Warm','Cold']).map(x=>`<option>${esc(x)}</option>`).join('')}</select></div></div>
      <button class="save" onclick="loadAdmin()">Show leads</button></div>
    <div id="adList"></div>`}
  const f={assigned:$('aShow').value,stage:$('aStage').value,city:$('aCityF').value,source:$('aSrcF').value,quality:$('aQF').value};
  S.adminSel=new Set();
  api('adminData',S.auth,f).then(r=>{
    S.admin=r;
    $('adTop').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div class="sec" style="margin:0">Lead pool</div><b style="font-size:28px">${r.pool.total}</b> <span class="sub">unassigned</span></div>
      <button class="chip on" style="padding:12px" onclick="doAuto()">⚡ Auto-assign</button></div>
      <div class="sub" style="color:var(--mut);margin:6px 0">${Object.entries(r.pool.byCity).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>esc(k)+': '+v).join(' · ')||'—'}</div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><button class="chip" style="flex:1" onclick="doSync()">🔄 Sync chatbot leads now</button><span class="sub" style="color:var(--mut);font-size:11px">Last: ${r.lastSync?fmt(new Date(r.lastSync).getTime()):'never'}</span></div>
      <div style="display:flex;gap:8px;align-items:center"><input id="stDays" type="number" value="2" min="1" style="flex:0 0 64px"><button class="chip" style="flex:1;white-space:normal" onclick="doReclaim()">♻ Return leads untouched for these many days to pool</button></div></div>
     <div class="card"><div class="sec">Caller load</div><table><tr><th>Caller</th><th>Open</th><th>Due now</th><th>New today</th><th>Daily cap</th></tr>
      ${r.callers.map(x=>`<tr><td>${esc(x.name)}<div class="sub" style="color:var(--mut)">${esc(x.cities)}</div></td><td>${x.open}</td><td>${x.due}</td><td>${x.newToday}</td><td>${x.cap}</td></tr>`).join('')}</table></div>`;
    renderAdminList();
  });
}
function renderAdminList(){
  const r=S.admin,c=S.cfg;
  $('adList').innerHTML=`<div class="card" style="position:sticky;top:52px;z-index:3">
     <div class="row" style="align-items:center"><label style="margin:0;display:flex;gap:6px;align-items:center;flex:0 0 auto"><input type="checkbox" class="chk" onchange="selAll(this.checked)"> All (${r.list.length})</label>
     <select id="aTarget"><option value="">— Unassign (to pool) —</option>${c.callers.map(x=>`<option>${esc(x)}</option>`).join('')}</select>
     <button class="chip on" onclick="doAssign()">Assign <span id="selN">0</span></button></div></div>
   ${r.list.map(l=>`<div class="card lead"><input type="checkbox" class="chk" data-id="${l.LeadID}" onchange="selOne(this)">
     <div class="main"><div class="nm">${esc(l.Name||l.Phone)}</div><div class="sub">${esc([l.JobRole,l.City,l.Source].filter(Boolean).join(' · '))} · ${ago(l.CreatedAt)}</div>
     <div>${l.Quality?`<span class="pill ${l.Quality}">${l.Quality}</span>`:''}<span class="pill">${esc(l.Stage||'New')}</span><span class="pill">👤 ${esc(l.AssignedTo||'Pool')}</span>${l.ProfilePct?`<span class="pill">${esc(l.ProfilePct)}%</span>`:''}</div></div></div>`).join('')||'<div class="card spin">No leads</div>'}`;
}
function selOne(cb){cb.checked?S.adminSel.add(cb.dataset.id):S.adminSel.delete(cb.dataset.id);$('selN').textContent=S.adminSel.size}
function selAll(on){document.querySelectorAll('#adList .chk[data-id]').forEach(cb=>{cb.checked=on;selOne(cb)})}
function doAssign(){if(!S.adminSel.size)return toast('Select leads first',true);const to=$('aTarget').value;
  api('assignLeads',S.auth,[...S.adminSel],to).then(n=>{toast(n+' leads '+(to?'assigned to '+to:'moved to pool'));loadAdmin()})}
function doSync(){toast('Syncing…');api('syncNow',S.auth).then(r=>{toast(`Sync: ${r.added} new, ${r.updated} updated`);loadAdmin()})}
function doAuto(){api('autoAssign',S.auth).then(n=>{toast(n+' leads auto-assigned');loadAdmin()})}
function doReclaim(){api('reclaimStale',S.auth,$('stDays').value).then(n=>{toast(n+' stale leads returned to pool');loadAdmin()})}

/* When caller returns from the phone app, bring the disposition into view */
</script>
